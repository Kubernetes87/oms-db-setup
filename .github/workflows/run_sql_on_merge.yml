name: Run SQL on Merge or Incremental Changes

on:
  pull_request:
    types:
      - closed
  push:
    branches:
      - main

jobs:
  run_sql_files:
    # Only run on PR merge OR direct pushes to main
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run all SQL files
        env:
          DATABASE_URL: ${{ secrets.NEON_DB_URL }}
        run: |
          echo "Running SQL files against Neon..."
          for file in $(find . -name "*.sql" | sort); do
            echo "Executing: $file"
            psql "$DATABASE_URL" -f "$file"
          done
